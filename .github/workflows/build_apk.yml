name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nadmha-pos-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.5-${{ github.run_number }}
          name: "نظمها Nadmha POS v1.3.5 (الكاشير المدمج الذكي، المسح المتعدد بالأزرار العائمة، وتبديل شبكة المخزون)"
          body: |
            ## 🛒 تطبيق نظمها (Nadmha POS) - الإصدار v1.3.5 التجاري
            تحديث ثوري شامل يرفع تجربة المستخدم لنقاط البيع إلى معايير الأنظمة التجارية العالمية الفاخرة:
            - 📷 **ماسح الكاميرا المدمج الذكي (Embedded POS Viewport)**: الكاميرا مدمجة في أعلى شاشة البيع بدون أي شاشات سوداء أو تنقلات معزولة؛ كل سلعة تمر أمام الكاميرا تنزل مباشرة في السلة وتحدث الإجمالي في أقل من ثانية!
            - ⚡ **المسح المتعدد الاحترافي (Multi-Scan Pro with Floating Trigger)**: زر دائري بارز وكبير عائم في الأسفل بمستوى إبهام اليد؛ التقط عشرات المنتجات المعروضة في الكادر دفعة واحدة بضغطة واحدة!
            - 📐 **التبديل بين القائمة والشبكة في المخزون (List / Grid View)**: زري تبديل سلسين (`=` و `::`) لاستعراض 42,000 سلعة كبطاقات شبكية عصرية أو قائمة تفصيلية مع شارات الكمية والأسعار.
            - 🔘 **الزر الأوسط التفاعلي في الشريط السفلي**: وصول فوري وفائق السرعة لشاشة البيع وتفعيل الكاميرا تلقائياً من أي مكان داخل التطبيق.
            - 🎨 **هوية بصرية تجارية فاخرة (Emerald Fintech Identity)**: تصميم أخضر زمردي راقي مع الأبيض الحجري المريح للعين، يلائم تماماً البرمجيات الاحترافية الموجهة للمتاجر.
            - 🛡️ **إدارة الطاقة والحساسات الذكية**: إيقاف حساسات الكاميرا آلياً عند مغادرة شاشة البيع لحفظ بطارية الهاتف، وإعادة تشغيلها فور العودة.
            - 🇩🇿 **دقة محاسبية 100%، تقريب 5 دج، وتوافق تام أوفلاين مدى الحياة**.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
