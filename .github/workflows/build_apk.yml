name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nadmha-pos-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.4-${{ github.run_number }}
          name: "نظمها Nadmha POS v1.3.4 (تدقيق محاسبي شامل، تقييم رأس مال المخزون، وفلترة التقارير)"
          body: |
            ## 🛒 تطبيق نظمها (Nadmha POS) - الإصدار v1.3.4
            تحديث وإصلاحات محاسبية ومالية شاملة تضمن دقة الأرقام والتقارير المالية 100%:
            - 📊 **تدقيق حساب الأرباح وهوامش الربح**: إظهار الربح الإجمالي وصافي الربح بدقة تامة دون تقريب قسري يخفي الخسائر التشغيلية، مع حساب النسبة المئوية الدقيقة.
            - 📅 **فلترة التقارير المالية الذكية (اليوم / هذا الشهر / الكل)**: إمكانية استعراض المبيعات والأرباح والمصروفات حسب الفترة الزمنية المحددة بسلاسة.
            - 📦 **تقييم رأس مال المخزون والأرباح المتوقعة**: ميزة جديدة في المخزون تعرض رأس المال المستثمر في السلع، القيمة البيعية الكلية، هامش الربح المتوقع، وإجمالي القطع المخزنة.
            - 💵 **إدارة صندوق الكاشير (Audit Trail)**: مزامنة دقيقة لعمليات استرجاع وإلغاء الفواتير ومصروفات الموردين مع الصندوق النشط تلقائياً لمنع أي عجز أو تضارب في جرد الإغلاق اليومي (Z-Report).
            - 🏷️ **حقل التخفيض الحي والتسديد الجزئي**: احتساب فوري للمجموع الصافي عند تطبيق أي تخفيض، ومعالجة ذكية للصرف المتبقي (Change) والديون عند السداد الجزئي.
            - 🇩🇿 **تقريب الدينار الجزائري (قاعدة 5 دج)**: معالجة صحيحة وسلسة لكافة الحسابات والأرقام السالبة والموجبة.
            - 🔒 **اختبارات وحدة برمجية مؤتمتة وتوافق تام أوفلاين 100%**.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
