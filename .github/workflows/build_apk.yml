name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nadmha-pos-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.6-${{ github.run_number }}
          name: "نظمها Nadmha POS v1.3.6 (إصلاحات محاسبية وتدقيق الديون، تسبيقات الزبائن، وسجل الفواتير الملغاة)"
          body: |
            ## 🛒 تطبيق نظمها (Nadmha POS) - الإصدار v1.3.6 (Audit & Financial Ledger Fixes)
            تحديث تدقيق مالي ومحاسبي عالي الدقة لإدارة الديون والفواتير وفق المعايير التجارية الصارمة:
            - 💳 **حل مشكلة رصيد الدين عند الدفع الجزئي للزبائن الجدد**: تسجيل المبلغ المتبقي كدين فوراً في دفتر الأستاذ دون أن يضيع أو يتحول لـ 0 دج.
            - 💰 **معالجة التسبيقات والمدفوعات الزائدة (Customer Overpayment & Advance Balance)**: عند دفع مبلغ أكبر من الدين، يظهر تأكيد بالمبلغ الزائد ويُحفظ كـ (+تسبيق لصالح الزبون) بلون أخضر زمردي مميز، ويُخصم تلقائياً في مشترياته القادمة.
            - 📑 **أرشيف وسجل الفواتير الملغاة (Soft-Cancel Audit Trail)**: لم تعد الفواتير الملغاة تحذف من قاعدة البيانات، بل تبقى مسجلة مع شارة (ملغاة 🚫)، تاريخ الإلغاء، وتبويب مخصص مع استبعادها من إيرادات اليوم.
            - 🔄 **مزامنة فورية بين شاشات الكاشير وسجل الديون**: تحديث تلقائي لحظي لكشوف الحسابات دون الحاجة لإعادة تشغيل التطبيق.
            - 🇩🇿 **دقة محاسبية 100%، تقريب 5 دج، وتوافق تام أوفلاين مع قاعدة بيانات محلية آمنة**.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
