name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nadmha-pos-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.3-${{ github.run_number }}
          name: "نظمها Nadmha POS v1.3.3 (Global POS Product Form, Live Profit Margin & Spacious UI)"
          body: |
            ## 🛒 تطبيق نظمها (Nadmha POS) - الإصدار v1.3.3
            تطوير كامل لتجربة إضافة وتعديل السلع وفقاً للمعايير العالمية لنقاط البيع (Global POS Standards):
            - 📱 **واجهة كاملة الشاشة متسعة لإضافة وتعديل السلع (`ProductFormScreen`)**: التخلص نهائياً من النوافذ الصغيرة والازدحام؛ شاشة مريحة تستغل كامل شاشة الهاتف بدون أي تداخل مع لوحة المفاتيح.
            - 📈 **حاسبة هامش الربح الحية (Live Profit Margin Indicator)**: حساب صافي ربح القطعة الواحدة ونسبة الربح المئوية (% دج) فورياً وبشكل مرئي أثناء كتابة سعر الشراء وسعر البيع.
            - 📷 **مسح الباركود المباشر وتوليد الرموز**: زر مسح بالكاميرا يفتح الماسح الضوئي المطور فوراً، مع زر توليد باركود تلقائي للسلع المحلية أو الموزونة.
            - 📦 **إدارة المخزون والتزويد السريع**: أزرار ذكية لزيادة المخزون بضغطة زر (`+10`, `+25`, `+50`, `+100`).
            - 🛋️ **نوافذ سفلية واسعة (Modal Bottom Sheets)**: استبدال النوافذ القديمة بنوافذ سفلية مريحة تراعي ارتفاع لوحة المفاتيح في الماسح الضوئي والكاشير.
            - 🎯 **المسح الفردي المستمر والمسح الجماعي للفرايم** مع شريط السلة المباشرة.
            - 🔒 **أداء فائق وحماية للبيانات أوفلاين 100%**.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
