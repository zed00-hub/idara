name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nadmha-pos-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.2-${{ github.run_number }}
          name: "نظمها Nadmha POS v1.3.2 (Live Scanned Cart, Frame Multi-Scan & Modern CameraSelector)"
          body: |
            ## 🛒 تطبيق نظمها (Nadmha POS) - الإصدار v1.3.2 الشامل
            تحديث شامل للماسح الضوئي، السلة المباشرة، وحل الكاميرا:
            - 🎯 **مسح فردي مستمر (سلعة بسلعة)**: يبقى الماسح مفتوحاً لتمرير المنتجات تباعاً وإضافتها للسلة دون انقطاع.
            - ⚡ **مسح جماعي ذكي لكافة سلع الفرايم**: التقاط ومعالجة جميع الباركودات الظاهرة في كادر الكاميرا في نفس اللحظة.
            - 🛒 **شريط وسلة المسح المباشرة (Live Scanned Cart)**: عرض السلع الممسوحة فورياً بالأسفل، مع عداد السلع، إجمالي المبلغ (دج)، وأزرار تعديل الكميات (+ و -)، مع زر متابعة الدفع بالكاشير.
            - 🏷️ **نافذة فورية لتسعير المنتجات غير المسعرة (0 دج)**: في حال مسح منتج من الكتالوج بسعر 0 دج، يطلب التطبيق تحديد سعر البيع فوراً وحفظه بقاعدة البيانات دون توقف.
            - ➕ **تسجيل المنتجات الجديدة غير المدرجة**: إمكانية إضافة اسم وسعر البيع وسعر التكلفة وإضافتها للسلة وللكتالوج فورياً.
            - 📷 **حل نهائي للكاميرا (ResolutionSelector & Recreate)**: اعتماد `useNewCameraSelector: true` وإعادة تهيئة نظيفة للمتحكم لتفادي `genericError` نهائياً على كافة إصدارات أندرويد.
            - 📸 **كاميرا النظام الاحتياطية**: إمكانية مسح الباركود باستخدام كاميرا الهاتف الرسمية في أي وقت.
            - 🔒 **حماية الكتالوج وأداء فائق أوفلاين 100%**.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
