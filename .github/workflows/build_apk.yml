name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nadmha-pos-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0-${{ github.run_number }}
          name: "نظمها Nadmha POS v1.2.0 (Dedicated Scanner & Supplier Invoices)"
          body: |
            ## 🛒 تطبيق نظمها (Nadmha POS) - الإصدار v1.2.0 الشامل
            تم بناء ملف الـ APK بنجاح بأحدث تجربة مستخدم ومزايا تصوير الوثائق:
            - 🎯 **زر باركود بارز ومركزي بالوسط** يفتح قائمة العمليات السريعة والماسح الضوئي المباشر
            - ☰ **قائمة جانبية متطورة (Drawer بثلاثة خطوط أفقية)** للتقارير، الموردين، وإعدادات المتجر
            - 📷 **ماسح باركود كامل الشاشة عالي الدقة (HD 1080p)** مع ليزر متحرك وتأكيد فوري
            - 📸 **تصوير فواتير ووصولات الموردين بالكاميرا** وحفظها في قسم الموردين مع إمكانية التكبير والتصغير
            - 📦 **كتالوج 42,010 منتج جزائري مدمج محلياً** يعمل 100% دون إنترنت
            - 🥖 **شريط البيع السريع للأصناف الشائعة** (خبز، حليب، بيض، ماء) وسلع بدون باركود
            - 🧾 **طباعة حرارية ESC/POS ومشاركة الفواتير كـ PDF عبر الواتساب**
            - 👥 **إدارة شاملة لديون الزبائن (الكريدي)** وكشوف الحسابات والتسديد
            - 📊 **تقرير Z-Report اليومي** وحركة صندوق الكاش والمصاريف والأرباح التقديرية
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
