name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nadmha-pos-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-${{ github.run_number }}
          name: "نظمها Nadmha POS v1.1.0 (Modern UI & Smart Scanner)"
          body: |
            ## 🛒 تطبيق نظمها (Nadmha POS) - الإصدار v1.1.0 العصري المتطور
            تم بناء ملف الـ APK بنجاح بأحدث تصميم وتقنيات مسح متطورة:
            - 🎨 **تصميم عصري وسلس (Modern 2026 Fintech UI)** مع دعم الوضع الفاتح والداكن
            - ⚡ **ماسح ضوئي ذكي فائق السرعة بالكاميرا** مع ليزر متحرك وتغذية لمسية وصوتية ولافتة تأكيد فورية
            - 📦 **كتالوج 42,010 منتج جزائري مدمج محلياً** يعمل 100% دون إنترنت
            - 🥖 **شريط البيع السريع للأصناف الشائعة** (خبز، حليب، بيض، ماء) وسلع بدون باركود
            - 🧾 **طباعة حرارية ESC/POS ومشاركة الفواتير كـ PDF عبر الواتساب**
            - 👥 **إدارة شاملة لديون الزبائن (الكريدي)** وكشوف الحسابات والتسديد
            - 📊 **تقرير Z-Report اليومي** وحركة صندوق الكاش والمصاريف والأرباح التقديرية
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
