name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nadmha-pos-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0-${{ github.run_number }}
          name: "نظمها Nadmha POS v1.3.0 (Fixed Camera, Master AppDrawer, Stock & Debt Protection)"
          body: |
            ## 🛒 تطبيق نظمها (Nadmha POS) - الإصدار v1.3.0 المستقر
            تم بناء ملف الـ APK بنجاح بأحدث تجربة مستخدم وإصلاحات الكاميرا والقوائم:
            - 📷 **إصلاح كامل لتشغيل الكاميرا والماسح الضوئي**: توافق 100% مع حساسات الكاميرا Portrait دون أي خطأ (genericError) ومعالجة الصلاحيات المباشرة وإعادة المحاولة.
            - ☰ **القائمة الجانبية (☰ AppDrawer)**: تعمل الآن في جميع الشاشات بمجرد لمس أيقونة الخطوط الثلاثة.
            - 🔒 **حماية وسرية كتالوج المنتجات**: إخفاء ومنع تصدير أو تحميل قائمة الـ 42,000 منتج للحفاظ على بيانات المحل.
            - 📦 **المخزون**: إضافة أزرار تعديل وحذف السلع، ومنع تكرار نفس الباركود لأكثر من منتج.
            - 👥 **الكريدي**: إجبار اختيار زبون للبيع الآجل/الجزئي، وتعديل وحذف الزبائن، وسجل الدفعات.
            - 🧾 **الفواتير والتقارير**: زر إلغاء واسترجاع الفاتورة للمخزون، وحذف المصروف، وفلترة مصاريف الشهر الحالي.
            - 📄 **تطبيق فلاتر أصلي أوفلاين 100%** مع قاعدة بيانات SQLite وطباعة حرارية بلوتوث و USB.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
