name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nadmha-pos-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1-${{ github.run_number }}
          name: "نظمها Nadmha POS v1.3.1 (Camera AutoStart Fix, ProGuard & Fallback System Camera)"
          body: |
            ## 🛒 تطبيق نظمها (Nadmha POS) - الإصدار v1.3.1 المعزز
            تم حل مشكلة الكاميرا والتهيئة نهائياً مع إضافة كاميرا النظام الاحتياطية وقواعد ProGuard:
            - 📷 **حل نهائي لتشغيل الكاميرا المباشرة**: تم ضبط `autoStart: false` وبدء الكاميرا بشكل آمن ومحمي (`_startCameraSafely`) بعد اكتمال انتقال الشاشة لتفادي تعارض CameraX.
            - 🛡️ **إضافة ملف قواعد ProGuard (`proguard-rules.pro`)**: حماية مكتبات Google MLKit و CameraX من الحذف أو التشويه في نسخ Release.
            - 📸 **زر كاميرا النظام الاحتياطي (`System Camera`)**: إمكانية مسح الباركود باستخدام تطبيق كاميرا الهاتف الرسمي والتعرف على الباركود فورياً في حال وجود أي قيود عتادية في الجهاز.
            - ⌨️ **إدخال الباركود يدوياً والبحث الفوري**: متوفر دائماً أسفل الشاشة.
            - ☰ **القائمة الجانبية (AppDrawer)**: تعمل في كل الشاشات بسلاسة وفورية.
            - 🔒 **حماية وسرية كتالوج المنتجات**: إخفاء ومنع تصدير أو تحميل قائمة الـ 42,000 منتج.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
